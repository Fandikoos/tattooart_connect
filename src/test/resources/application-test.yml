# Archivo que evita mySQL en los tests de CI
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # Crea tablas al arrancar y las borra al terminar, create-drop, asi la db siempre esta limpia y no hay datos sucios entre
    # ejecuciones de tests
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: false

server:
  port: 0
