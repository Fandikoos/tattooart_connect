spring.application.name=tattooart-connect

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/tattooart_db
spring.datasource.username=fandiks
spring.datasource.password=fandikoos8

# JPA/Hibernate Creará/modificará tablas automáticamente (el update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Para ver logs detallados
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Tamaño de los archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

media.location=mediafiles

